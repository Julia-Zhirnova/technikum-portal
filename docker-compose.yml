version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: technikum_db
      POSTGRES_USER: technikum_user
      POSTGRES_PASSWORD: your_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"

  backend:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    command: npm run dev
    ports:
      - "5173:5173"

  celery:
    build: .
    command: celery -A config worker -l info
    depends_on:
      - redis

volumes:
  postgres_data:
