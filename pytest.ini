[pytest]
DJANGO_SETTINGS_MODULE = config.settings

python_files = test_*.py *_tests.py

addopts = --reuse-db --nomigrations -n auto -m "not e2e"

norecursedirs = .git venv node_modules frontend/dist static media backups

markers =
    e2e: end-to-end тесты через Playwright (требуют запущенных dev-серверов)
    cache_sensitive: Тесты, использующие общий Redis-кэш (выполняются последовательно)
